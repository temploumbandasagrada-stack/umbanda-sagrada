<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Casa de Estudo — Meu caminho</title>
<style>
/* ============================================================
   CASA DE ESTUDO — identidade visual
   Azul-noite de terreiro, dourado de vela, branco de Oxalá
   ============================================================ */
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Jost:wght@300;400;500;600&display=swap');

:root {
  --noite: #0D1321;
  --noite-2: #111A2E;
  --altar: #16203A;
  --altar-2: #1B2745;
  --ouro: #C9A227;
  --ouro-claro: #E8CE7A;
  --oxala: #F4EFE3;
  --oxala-2: #C8C2B2;
  --agua: #7FA3C4;
  --erva: #6FA383;
  --perigo: #C46A6A;
  --linha: rgba(201, 162, 39, .22);
  --sombra: 0 18px 50px rgba(0, 0, 0, .45);
  --raio: 14px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--noite);
  background-image:
    radial-gradient(ellipse 60% 40% at 50% -5%, rgba(201,162,39,.10), transparent 70%),
    radial-gradient(ellipse 40% 30% at 90% 100%, rgba(127,163,196,.06), transparent 70%);
  background-attachment: fixed;
  color: var(--oxala);
  font-family: 'Jost', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  letter-spacing: .015em;
}

h1, h2, h3, .serif { font-family: 'Cormorant Garamond', serif; font-weight: 600; color: var(--oxala); }
h1 { font-size: 2.1rem; } h2 { font-size: 1.6rem; } h3 { font-size: 1.25rem; }

a { color: var(--ouro-claro); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---- Firmeza: divisor com estrela-guia (assinatura visual) ---- */
.firmeza {
  display: flex; align-items: center; gap: 14px;
  color: var(--ouro); margin: 6px 0 22px;
}
.firmeza::before, .firmeza::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, transparent, var(--linha));
}
.firmeza::after { background: linear-gradient(90deg, var(--linha), transparent); }
.estrela { font-size: .8rem; color: var(--ouro); letter-spacing: .3em; }

/* ---- Topo ---- */
.topo {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 28px; border-bottom: 1px solid var(--linha);
  background: rgba(13, 19, 33, .85); backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 50;
}
.topo .marca { display: flex; align-items: center; gap: 12px; }
.topo .marca .simbolo {
  width: 38px; height: 38px; border: 1px solid var(--ouro);
  border-radius: 50%; display: grid; place-items: center;
  color: var(--ouro-claro); font-size: 1rem;
  box-shadow: 0 0 18px rgba(201,162,39,.25) inset, 0 0 12px rgba(201,162,39,.15);
}
.topo .marca h1 { font-size: 1.3rem; letter-spacing: .04em; }
.topo .marca small { display: block; color: var(--ouro); font-family: 'Jost'; font-size: .68rem; letter-spacing: .28em; text-transform: uppercase; font-weight: 400; }

/* ---- Navegação por abas ---- */
.abas { display: flex; gap: 6px; flex-wrap: wrap; padding: 14px 28px 0; }
.aba {
  background: none; border: 1px solid transparent; color: var(--oxala-2);
  font-family: 'Jost'; font-size: .82rem; letter-spacing: .14em; text-transform: uppercase;
  padding: 9px 16px; cursor: pointer; border-radius: 999px; transition: all .25s;
}
.aba:hover { color: var(--ouro-claro); }
.aba.ativa { color: var(--ouro-claro); border-color: var(--linha); background: rgba(201,162,39,.07); }

/* ---- Conteúdo ---- */
.conteudo { max-width: 1100px; margin: 0 auto; padding: 26px 28px 80px; }
.secao { display: none; animation: surge .35s ease; }
.secao.ativa { display: block; }
@keyframes surge { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---- Cartões ---- */
.cartao {
  background: linear-gradient(160deg, var(--altar), var(--noite-2));
  border: 1px solid var(--linha); border-radius: var(--raio);
  padding: 22px; margin-bottom: 16px; box-shadow: var(--sombra);
}
.grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }

/* ---- Formulários ---- */
label { display: block; font-size: .74rem; letter-spacing: .18em; text-transform: uppercase; color: var(--ouro); margin: 12px 0 6px; font-weight: 400; }
input, select, textarea {
  width: 100%; background: var(--noite); border: 1px solid var(--linha);
  border-radius: 8px; color: var(--oxala); padding: 11px 13px;
  font-family: 'Jost'; font-size: .95rem;
}
input:focus, select:focus, textarea:focus { outline: 2px solid rgba(201,162,39,.4); border-color: var(--ouro); }
textarea { min-height: 100px; resize: vertical; }

/* ---- Botões ---- */
.btn {
  display: inline-block; background: linear-gradient(160deg, var(--ouro), #A8861D);
  color: #1a1408; border: none; border-radius: 999px;
  font-family: 'Jost'; font-weight: 500; font-size: .85rem; letter-spacing: .12em; text-transform: uppercase;
  padding: 11px 26px; cursor: pointer; transition: all .25s; margin-top: 14px;
}
.btn:hover { box-shadow: 0 0 22px rgba(201,162,39,.4); transform: translateY(-1px); }
.btn-fantasma {
  background: none; border: 1px solid var(--linha); color: var(--ouro-claro);
}
.btn-fantasma:hover { border-color: var(--ouro); box-shadow: none; }
.btn-mini { padding: 6px 14px; font-size: .72rem; margin: 4px 4px 0 0; }
.btn-perigo { background: none; border: 1px solid rgba(196,106,106,.4); color: var(--perigo); }

/* ---- Tabela ---- */
table { width: 100%; border-collapse: collapse; font-size: .92rem; }
th { text-align: left; font-family: 'Jost'; font-weight: 500; font-size: .72rem; letter-spacing: .16em; text-transform: uppercase; color: var(--ouro); padding: 10px 12px; border-bottom: 1px solid var(--linha); }
td { padding: 12px; border-bottom: 1px solid rgba(201,162,39,.08); color: var(--oxala-2); }
tr:hover td { color: var(--oxala); }

/* ---- Selo / etiqueta ---- */
.selo { display: inline-block; font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--linha); color: var(--ouro-claro); }
.selo.verde { border-color: rgba(111,163,131,.5); color: var(--erva); }
.selo.vermelho { border-color: rgba(196,106,106,.5); color: var(--perigo); }
.selo.azul { border-color: rgba(127,163,196,.5); color: var(--agua); }

/* ---- Aviso ---- */
.aviso { padding: 12px 16px; border-radius: 10px; font-size: .9rem; margin-top: 12px; display: none; }
.aviso.erro { display: block; background: rgba(196,106,106,.12); border: 1px solid rgba(196,106,106,.4); color: #E8B4B4; }
.aviso.ok { display: block; background: rgba(111,163,131,.12); border: 1px solid rgba(111,163,131,.4); color: #B9DcC8; }

/* ---- Modal ---- */
.veu { position: fixed; inset: 0; background: rgba(7,10,18,.75); backdrop-filter: blur(4px); display: none; place-items: center; z-index: 100; padding: 20px; }
.veu.aberto { display: grid; }
.modal { background: linear-gradient(160deg, var(--altar), var(--noite-2)); border: 1px solid var(--linha); border-radius: var(--raio); padding: 28px; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto; box-shadow: var(--sombra); }

.vazio { text-align: center; color: var(--oxala-2); padding: 40px 20px; font-style: italic; font-family: 'Cormorant Garamond'; font-size: 1.1rem; }
.mudo { color: var(--oxala-2); font-size: .88rem; }

video, iframe.video { width: 100%; aspect-ratio: 16/9; border: 1px solid var(--linha); border-radius: 10px; background: #000; }

@media (max-width: 640px) {
  .topo { padding: 14px 16px; }
  .abas, .conteudo { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>
</head>
<body>

<header class="topo">
  <div class="marca">
    <div class="simbolo">✦</div>
    <div>
      <h1>Casa de Estudo</h1>
      <small id="saudacao">Meu caminho</small>
    </div>
  </div>
  <button class="btn btn-fantasma btn-mini" onclick="sair()">Sair</button>
</header>

<nav class="abas">
  <button class="aba ativa" data-secao="cursos" onclick="irPara('cursos')">Meus estudos</button>
  <button class="aba" data-secao="biblioteca" onclick="irPara('biblioteca')">Biblioteca</button>
  <button class="aba" data-secao="giras" onclick="irPara('giras')">Giras</button>
</nav>

<main class="conteudo">

  <!-- ==================== ESTUDOS ==================== -->
  <section class="secao ativa" id="sec-cursos">
    <h2>Meus estudos</h2>
    <div class="firmeza"><span class="estrela">✦ ✦ ✦</span></div>
    <div id="listaCursos"></div>
  </section>

  <!-- ==================== BIBLIOTECA ==================== -->
  <section class="secao" id="sec-biblioteca">
    <h2>Biblioteca da casa</h2>
    <div class="firmeza"><span class="estrela">✦ ✦ ✦</span></div>
    <div class="grade" id="listaBiblioteca"></div>
  </section>

  <!-- ==================== GIRAS ==================== -->
  <section class="secao" id="sec-giras">
    <h2>Giras e minhas anotações</h2>
    <div class="firmeza"><span class="estrela">✦ ✦ ✦</span></div>
    <div id="listaGiras"></div>
  </section>
</main>

<!-- MODAL AULA -->
<div class="veu" id="veuAula">
  <div class="modal" style="max-width:760px">
    <h3 id="aulaModalTitulo"></h3>
    <div id="aulaModalCorpo" style="margin-top:14px"></div>
    <button class="btn" id="btnConcluirAula">Marcar como concluída</button>
    <button class="btn btn-fantasma" onclick="fechar('veuAula')">Fechar</button>
  </div>
</div>

<!-- MODAL PROVA -->
<div class="veu" id="veuProva">
  <div class="modal" style="max-width:700px">
    <h3 id="provaModalTitulo"></h3>
    <div id="provaModalCorpo" style="margin-top:14px"></div>
    <button class="btn" id="btnEntregarProva" onclick="entregarProva()">Entregar prova</button>
    <button class="btn btn-fantasma" onclick="fechar('veuProva')">Fechar</button>
    <div class="aviso" id="avisoProva"></div>
  </div>
</div>

<!-- MODAL LEITOR DE LIVRO -->
<div class="veu" id="veuLeitor">
  <div class="modal" style="max-width:900px; padding:18px">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap">
      <h3 id="leitorTitulo" style="margin:0"></h3>
      <button class="btn btn-fantasma btn-mini" style="margin:0" onclick="fecharLeitor()">Fechar</button>
    </div>
    <div style="margin:10px 0 6px; height:6px; background:var(--noite); border-radius:99px; overflow:hidden">
      <div id="leitorBarra" style="height:100%; width:0%; background:linear-gradient(90deg,var(--ouro),var(--ouro-claro)); border-radius:99px; transition:width .3s"></div>
    </div>
    <p class="mudo" id="leitorStatus" style="font-size:.82rem; margin-bottom:10px"></p>
    <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:10px; flex-wrap:wrap">
      <button class="btn btn-fantasma btn-mini" style="margin:0" onclick="paginaAnterior()">‹ Anterior</button>
      <span class="mudo" id="leitorPagina" style="font-size:.9rem"></span>
      <button class="btn btn-fantasma btn-mini" style="margin:0" onclick="proximaPagina()">Próxima ›</button>
    </div>
    <div style="max-height:62vh; overflow:auto; text-align:center; background:#000; border:1px solid var(--linha); border-radius:10px; padding:8px">
      <canvas id="leitorCanvas" style="max-width:100%; height:auto"></canvas>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  window['pdfjsLib'].GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

<script>

const SUPABASE_URL = "https://jqepdfxtqdjtozbrlkrm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxZXBkZnh0cWRqdG96YnJsa3JtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MTM4NjUsImV4cCI6MjEwMTE4OTg2NX0.9B_GAcACUsRBAe1GY7MUzmk1prquDsA6YsKp3f3v4Z0";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Pega o usuário logado + perfil. Redireciona se não estiver logado.
async function exigirLogin() {
  const { data: { session } } = await db.auth.getSession();
  if (!session) { window.location.href = "index.html"; return null; }
  const { data: perfil } = await db.from("profiles").select("*").eq("id", session.user.id).single();
  if (!perfil) { window.location.href = "index.html"; return null; }
  return perfil;
}

async function sair() {
  await db.auth.signOut();
  window.location.href = "index.html";
}

// Transforma link do YouTube em link de embed
function youtubeEmbed(url) {
  if (!url) return "";
  const m = url.match(/(?:youtu\.be\/|v=|embed\/)([\w-]{11})/);
  return m ? `https://www.youtube.com/embed/${m[1]}` : url;
}

function escapeHtml(t) {
  return (t || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

<script>
let eu = null;
let concluidas = new Set();
let provaAberta = null;

init();
async function init() {
  eu = await exigirLogin();
  if (!eu) return;
  if (eu.role === 'admin') { window.location.href = 'admin.html'; return; }
  if (!eu.ativo) { await sair(); return; }
  document.getElementById('saudacao').textContent = 'Axé, ' + eu.nome.split(' ')[0] + ' · Nível ' + eu.nivel;
  await carregarProgresso();
  carregarCursos(); carregarBiblioteca(); carregarGiras();
}

function irPara(secao) {
  document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
  document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
  document.getElementById('sec-' + secao).classList.add('ativa');
  document.querySelector(`[data-secao="${secao}"]`).classList.add('ativa');
}
function fechar(id) { document.getElementById(id).classList.remove('aberto'); }

/* ==================== ESTUDOS ==================== */
async function carregarProgresso() {
  const { data } = await db.from('progresso_aulas').select('aula_id').eq('aluno_id', eu.id);
  concluidas = new Set((data || []).map(p => p.aula_id));
}

async function carregarCursos() {
  const { data: cursos } = await db.from('cursos')
    .select('*, modulos(*, aulas(*), provas(*))')
    .eq('ativo', true).lte('nivel', eu.nivel).order('nivel');
  const { data: resultados } = await db.from('resultados_provas').select('*').eq('aluno_id', eu.id);
  const aprovadas = new Set((resultados || []).filter(r => r.aprovado).map(r => r.prova_id));

  const el = document.getElementById('listaCursos');
  if (!cursos || !cursos.length) { el.innerHTML = '<p class="vazio">Nenhum curso liberado para o seu nível ainda.</p>'; return; }

  el.innerHTML = cursos.map(c => {
    const todasAulas = (c.modulos || []).flatMap(m => m.aulas || []);
    const feitas = todasAulas.filter(a => concluidas.has(a.id)).length;
    const pct = todasAulas.length ? Math.round(feitas / todasAulas.length * 100) : 0;
    return `
    <div class="cartao">
      <h3>${escapeHtml(c.titulo)} <span class="selo">Nível ${c.nivel}</span></h3>
      <p class="mudo">${escapeHtml(c.descricao || '')}</p>
      <div style="margin:10px 0; height:6px; background:var(--noite); border-radius:99px; overflow:hidden">
        <div style="height:100%; width:${pct}%; background:linear-gradient(90deg,var(--ouro),var(--ouro-claro)); border-radius:99px"></div>
      </div>
      <p class="mudo" style="font-size:.8rem">${pct}% concluído</p>
      ${(c.modulos || []).sort((a,b) => a.ordem - b.ordem).map(m => `
        <div style="border-left:2px solid var(--linha); margin:14px 0 0 8px; padding-left:16px">
          <strong class="serif" style="font-size:1.05rem">${escapeHtml(m.titulo)}</strong>
          ${(m.aulas || []).sort((a,b) => a.ordem - b.ordem).map(a => `
            <div style="margin:8px 0 0 4px">
              <a onclick='abrirAula(${JSON.stringify(a).replace(/'/g, "&#39;")})' style="cursor:pointer">
                ${concluidas.has(a.id) ? '<span style="color:var(--erva)">✔</span>' : (a.tipo === 'video' ? '▶' : a.tipo === 'pdf' ? '📄' : '✎')}
                ${escapeHtml(a.titulo)}
              </a>
            </div>`).join('')}
          ${(m.provas || []).map(p => `
            <div style="margin:10px 0 0 4px">
              ${aprovadas.has(p.id)
                ? `<span class="selo verde">✔ Prova concluída: ${escapeHtml(p.titulo)}</span>`
                : `<button class="btn btn-mini" onclick="abrirProva('${p.id}')">Fazer prova: ${escapeHtml(p.titulo)}</button>`}
            </div>`).join('')}
        </div>`).join('')}
    </div>`;
  }).join('');
}

function abrirAula(aula) {
  document.getElementById('aulaModalTitulo').textContent = aula.titulo;
  let corpo = '';
  if (aula.tipo === 'video') corpo = `<iframe class="video" src="${youtubeEmbed(aula.video_url)}" allowfullscreen></iframe>`;
  if (aula.tipo === 'pdf') corpo = `<a href="${aula.arquivo_url}" target="_blank" class="btn btn-fantasma">Abrir material em PDF</a>`;
  if (aula.tipo === 'texto') corpo = `<div style="white-space:pre-wrap; line-height:1.7">${escapeHtml(aula.conteudo || '')}</div>`;
  document.getElementById('aulaModalCorpo').innerHTML = corpo;
  const btn = document.getElementById('btnConcluirAula');
  if (concluidas.has(aula.id)) { btn.style.display = 'none'; }
  else {
    btn.style.display = 'inline-block';
    btn.onclick = async () => {
      await db.from('progresso_aulas').insert({ aluno_id: eu.id, aula_id: aula.id });
      concluidas.add(aula.id);
      fechar('veuAula'); carregarCursos();
    };
  }
  document.getElementById('veuAula').classList.add('aberto');
}

/* ==================== PROVAS ==================== */
async function abrirProva(provaId) {
  const { data: prova } = await db.from('provas').select('*, questoes(*)').eq('id', provaId).single();
  if (!prova || !(prova.questoes || []).length) return alert('Esta prova ainda não tem questões.');
  provaAberta = prova;
  document.getElementById('provaModalTitulo').textContent = prova.titulo;
  document.getElementById('provaModalCorpo').innerHTML =
    `<p class="mudo">Nota mínima para aprovação: ${prova.nota_minima}%</p>` +
    prova.questoes.sort((a,b) => a.ordem - b.ordem).map((q, i) => `
      <div style="margin-top:18px">
        <strong>${i + 1}. ${escapeHtml(q.enunciado)}</strong>
        ${['a','b','c','d'].map(op => `
          <label style="display:flex; gap:10px; align-items:center; text-transform:none; letter-spacing:0; font-size:.95rem; color:var(--oxala); cursor:pointer; margin:8px 0 0">
            <input type="radio" name="q_${q.id}" value="${op}" style="width:auto"> ${escapeHtml(q['opcao_' + op])}
          </label>`).join('')}
      </div>`).join('');
  document.getElementById('btnEntregarProva').style.display = 'inline-block';
  document.getElementById('veuProva').classList.add('aberto');
}

async function entregarProva() {
  const qs = provaAberta.questoes;
  let acertos = 0, respondidas = 0;
  qs.forEach(q => {
    const marcada = document.querySelector(`input[name="q_${q.id}"]:checked`);
    if (marcada) { respondidas++; if (marcada.value === q.correta) acertos++; }
  });
  if (respondidas < qs.length) {
    const el = document.getElementById('avisoProva');
    el.className = 'aviso erro'; el.textContent = 'Responda todas as questões antes de entregar.';
    return;
  }
  const nota = Math.round(acertos / qs.length * 100);
  const aprovado = nota >= provaAberta.nota_minima;
  await db.from('resultados_provas').insert({ prova_id: provaAberta.id, aluno_id: eu.id, nota, aprovado });
  const el = document.getElementById('avisoProva');
  el.className = 'aviso ' + (aprovado ? 'ok' : 'erro');
  el.textContent = aprovado
    ? `Aprovado, axé! Sua nota: ${nota}%.`
    : `Nota: ${nota}%. Mínimo: ${provaAberta.nota_minima}%. Estude mais um pouco e tente novamente.`;
  document.getElementById('btnEntregarProva').style.display = 'none';
  carregarCursos();
}

/* ==================== BIBLIOTECA ==================== */
async function carregarBiblioteca() {
  const { data } = await db.from('biblioteca').select('*').order('created_at', { ascending: false });
  const { data: prog } = await db.from('progresso_leitura').select('*').eq('aluno_id', eu.id);
  const mapaProg = {}; (prog || []).forEach(p => mapaProg[p.livro_id] = p);

  document.getElementById('listaBiblioteca').innerHTML = (data || []).map(l => {
    const p = mapaProg[l.id];
    const pct = (p && p.total_paginas > 1) ? Math.round((p.pagina / p.total_paginas) * 100) : 0;
    const temPdf = !!l.arquivo_url;
    return `
    <div class="cartao">
      ${l.capa_url ? `<img src="${l.capa_url}" alt="Capa de ${escapeHtml(l.titulo)}" style="width:100%; max-height:240px; object-fit:cover; border-radius:10px; border:1px solid var(--linha); margin-bottom:12px">` : ''}
      <h3>${escapeHtml(l.titulo)}</h3>
      <p class="mudo">${escapeHtml(l.autor || '')}</p>
      <p style="font-size:.9rem; margin-top:6px">${escapeHtml(l.descricao || '')}</p>
      ${temPdf ? `
        <div style="margin:10px 0 4px; height:6px; background:var(--noite); border-radius:99px; overflow:hidden">
          <div style="height:100%; width:${pct}%; background:linear-gradient(90deg,var(--ouro),var(--ouro-claro)); border-radius:99px"></div>
        </div>
        <p class="mudo" style="font-size:.78rem">${p ? `${pct}% lido — parou na página ${p.pagina}` : 'Ainda não iniciado'}</p>
        <button class="btn btn-mini" onclick='abrirLeitor(${JSON.stringify({id:l.id, titulo:l.titulo, arquivo_url:l.arquivo_url}).replace(/'/g,"&#39;")})'>${p ? 'Continuar lendo' : 'Ler'}</button>
      ` : ''}
      ${l.link ? `<a href="${escapeHtml(l.link)}" target="_blank" class="btn btn-mini btn-fantasma">Abrir link</a>` : ''}
    </div>`;
  }).join('') || '<p class="vazio">A biblioteca ainda está vazia.</p>';
}

/* ==================== LEITOR DE LIVRO ==================== */
let pdfAtual = null, livroAtual = null, paginaAtual = 1, totalPaginas = 1, renderizando = false;

async function abrirLeitor(livro) {
  livroAtual = livro;
  document.getElementById('leitorTitulo').textContent = livro.titulo;
  document.getElementById('leitorStatus').textContent = 'Carregando livro...';
  document.getElementById('veuLeitor').classList.add('aberto');
  try {
    pdfAtual = await pdfjsLib.getDocument(livro.arquivo_url).promise;
    totalPaginas = pdfAtual.numPages;
    // pega onde parou
    const { data: p } = await db.from('progresso_leitura').select('*').eq('aluno_id', eu.id).eq('livro_id', livro.id).maybeSingle();
    paginaAtual = (p && p.pagina >= 1 && p.pagina <= totalPaginas) ? p.pagina : 1;
    await renderizarPagina();
  } catch (e) {
    document.getElementById('leitorStatus').textContent = 'Não foi possível abrir este livro.';
  }
}

async function renderizarPagina() {
  if (!pdfAtual || renderizando) return;
  renderizando = true;
  const page = await pdfAtual.getPage(paginaAtual);
  const canvas = document.getElementById('leitorCanvas');
  const ctx = canvas.getContext('2d');
  const viewport = page.getViewport({ scale: 1.5 });
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: ctx, viewport }).promise;
  renderizando = false;

  const pct = totalPaginas > 1 ? Math.round((paginaAtual / totalPaginas) * 100) : 100;
  document.getElementById('leitorBarra').style.width = pct + '%';
  document.getElementById('leitorPagina').textContent = `Página ${paginaAtual} de ${totalPaginas}`;
  document.getElementById('leitorStatus').textContent = `${pct}% concluído`;
  salvarProgressoLeitura();
}

async function proximaPagina() {
  if (paginaAtual < totalPaginas) { paginaAtual++; await renderizarPagina(); }
}
async function paginaAnterior() {
  if (paginaAtual > 1) { paginaAtual--; await renderizarPagina(); }
}

async function salvarProgressoLeitura() {
  if (!livroAtual) return;
  await db.from('progresso_leitura').upsert({
    aluno_id: eu.id, livro_id: livroAtual.id,
    pagina: paginaAtual, total_paginas: totalPaginas, atualizado_em: new Date().toISOString()
  }, { onConflict: 'aluno_id,livro_id' });
}

function fecharLeitor() {
  salvarProgressoLeitura();
  document.getElementById('veuLeitor').classList.remove('aberto');
  pdfAtual = null; livroAtual = null;
  carregarBiblioteca(); // atualiza a barra no cartão
}

/* ==================== GIRAS ==================== */
async function carregarGiras() {
  const { data: giras } = await db.from('giras').select('*').order('data', { ascending: false });
  const { data: minhas } = await db.from('anotacoes_gira').select('*').eq('aluno_id', eu.id);
  const mapa = {}; (minhas || []).forEach(a => mapa[a.gira_id] = a);

  document.getElementById('listaGiras').innerHTML = (giras || []).map(g => {
    const nota = mapa[g.id];
    return `
    <div class="cartao">
      <h3>${escapeHtml(g.titulo)} <span class="selo azul">${new Date(g.data + 'T12:00').toLocaleDateString('pt-BR')}</span></h3>
      <p style="white-space:pre-wrap; margin-top:8px">${escapeHtml(g.descricao || '')}</p>
      <label>Minhas anotações pós-gira</label>
      <textarea id="nota_${g.id}">${escapeHtml(nota ? nota.texto : '')}</textarea>
      <button class="btn btn-mini" onclick="salvarAnotacao('${g.id}', ${nota ? `'${nota.id}'` : 'null'})">Guardar anotação</button>
      <span class="mudo" id="ok_${g.id}" style="font-size:.8rem"></span>
    </div>`;
  }).join('') || '<p class="vazio">Nenhuma gira registrada ainda.</p>';
}
async function salvarAnotacao(giraId, anotacaoId) {
  const texto = document.getElementById('nota_' + giraId).value.trim();
  if (!texto) return;
  if (anotacaoId) await db.from('anotacoes_gira').update({ texto }).eq('id', anotacaoId);
  else await db.from('anotacoes_gira').insert({ gira_id: giraId, aluno_id: eu.id, texto });
  document.getElementById('ok_' + giraId).textContent = ' ✔ guardado';
  setTimeout(() => carregarGiras(), 800);
}
