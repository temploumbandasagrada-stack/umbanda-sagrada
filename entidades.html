<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Minhas Entidades — Casa de Estudo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --noite:#0a1020; --noite2:#111a2e; --card:#16213a; --borda:#243350;
  --ouro:#d4af37; --ouro-claro:#f0d98a; --branco:#f5f2ea; --suave:#9fb0cc;
  --vermelho:#8b2f3a;
}
body.pergaminho{
  --noite:#efe6d2; --noite2:#e6dbc2; --card:#f7f1e2; --borda:#d4c5a1;
  --ouro:#8a6a17; --ouro-claro:#6b520f; --branco:#2b2416; --suave:#6d6045;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--noite); color:var(--branco);
  font-family:'Jost',sans-serif; font-weight:300;
  min-height:100vh; padding-bottom:60px;
  transition:background .3s,color .3s;
}
header{
  background:linear-gradient(180deg,var(--noite2),var(--noite));
  border-bottom:1px solid var(--borda);
  padding:22px 18px 18px; text-align:center; position:relative;
}
header h1{
  font-family:'Cormorant Garamond',serif; font-weight:600;
  font-size:30px; color:var(--ouro-claro); letter-spacing:.5px;
}
header p{font-size:13px;color:var(--suave);margin-top:4px}
.topo-btns{position:absolute;top:14px;right:14px;display:flex;gap:8px}
.topo-btns button{
  background:transparent;border:1px solid var(--borda);color:var(--suave);
  border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-family:'Jost',sans-serif;
}
.voltar{position:absolute;top:14px;left:14px}
.voltar a{color:var(--suave);text-decoration:none;font-size:13px;border:1px solid var(--borda);border-radius:8px;padding:6px 10px;display:inline-block}

.wrap{max-width:820px;margin:0 auto;padding:18px 14px}

.painel-admin{
  background:var(--card);border:1px solid var(--borda);border-radius:12px;
  padding:12px 14px;margin-bottom:18px;display:none;
}
.painel-admin label{font-size:12px;color:var(--suave);display:block;margin-bottom:6px}
select,input,textarea{
  width:100%;background:var(--noite2);border:1px solid var(--borda);
  color:var(--branco);border-radius:8px;padding:10px 12px;
  font-family:'Jost',sans-serif;font-size:15px;
}
textarea{resize:vertical;min-height:60px}
input::placeholder,textarea::placeholder{color:var(--suave);opacity:.7}

.linha{
  background:var(--card); border:1px solid var(--borda);
  border-left:3px solid var(--ouro);
  border-radius:12px; margin-bottom:14px; overflow:hidden;
}
.linha.esquerda{border-left-color:var(--vermelho)}
.linha-topo{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 16px;cursor:pointer;gap:10px;
}
.linha-nome{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--ouro-claro);line-height:1.1}
.linha-sub{font-size:11px;color:var(--suave);letter-spacing:1.2px;text-transform:uppercase;margin-top:2px}
.contador{
  font-size:12px;color:var(--suave);border:1px solid var(--borda);
  border-radius:20px;padding:3px 10px;white-space:nowrap;
}
.linha-corpo{display:none;padding:0 16px 16px}
.linha.aberta .linha-corpo{display:block}

.entidade{
  background:var(--noite2);border:1px solid var(--borda);border-radius:10px;
  padding:12px 14px;margin-bottom:10px;
}
.entidade h4{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:600;color:var(--branco)}
.entidade .meta{font-size:12px;color:var(--suave);margin-top:2px}
.entidade .obs{font-size:14px;color:var(--branco);opacity:.85;margin-top:8px;white-space:pre-wrap;line-height:1.5}
.entidade .acoes{display:flex;gap:14px;margin-top:10px}
.entidade .acoes button{background:none;border:none;color:var(--suave);font-size:12px;cursor:pointer;font-family:'Jost',sans-serif;text-decoration:underline}

.vazio{font-size:14px;color:var(--suave);font-style:italic;padding:6px 0 12px}

.btn-add{
  width:100%;background:transparent;border:1px dashed var(--ouro);
  color:var(--ouro-claro);border-radius:10px;padding:11px;
  font-family:'Jost',sans-serif;font-size:14px;cursor:pointer;
}
.btn-add:hover{background:rgba(212,175,55,.08)}

.form-ent{display:none;margin-top:10px}
.form-ent.ativo{display:block}
.form-ent .campo{margin-bottom:10px}
.form-ent label{font-size:12px;color:var(--suave);display:block;margin-bottom:5px}
.form-ent .linha2{display:flex;gap:10px}
.form-ent .linha2>div{flex:1}
.btns{display:flex;gap:10px;margin-top:4px}
.btn-ouro{
  background:var(--ouro);color:#1a1206;border:none;border-radius:8px;
  padding:11px 18px;font-family:'Jost',sans-serif;font-weight:500;font-size:14px;cursor:pointer;
}
.btn-vazio{
  background:transparent;color:var(--suave);border:1px solid var(--borda);
  border-radius:8px;padding:11px 18px;font-family:'Jost',sans-serif;font-size:14px;cursor:pointer;
}

#aviso{
  position:fixed;left:50%;transform:translateX(-50%);bottom:24px;
  background:var(--card);border:1px solid var(--ouro);color:var(--branco);
  padding:12px 20px;border-radius:10px;font-size:14px;display:none;z-index:50;
}
.carregando{text-align:center;color:var(--suave);padding:40px 0;font-style:italic}
@media(max-width:480px){
  .form-ent .linha2{flex-direction:column;gap:0}
  header h1{font-size:25px}
}
</style>
</head>
<body>

<header>
  <div class="voltar"><a href="aluno.html">← Voltar</a></div>
  <div class="topo-btns"><button onclick="trocarTema()" id="btnTema">☾</button></div>
  <h1>Minhas Entidades</h1>
  <p id="subtitulo">Carregando…</p>
</header>

<div class="wrap">
  <div class="painel-admin" id="painelAdmin">
    <label>Ver as entidades de:</label>
    <select id="seletorMedium" onchange="trocarMedium()"></select>
  </div>
  <div id="conteudo"><div class="carregando">Abrindo o caderno…</div></div>
</div>

<div id="aviso"></div>

<script>
// ===============================================
// CONFIGURAÇÃO
// ===============================================
const SUPABASE_URL = "https://jqepdfxtqdjtozbrlkrm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxZXBkZnh0cWRqdG96YnJsa3JtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MTM4NjUsImV4cCI6MjEwMTE4OTg2NX0.9B_GAcACUsRBAe1GY7MUzmk1prquDsA6YsKp3f3v4Z0";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ===============================================
// AS LINHAS DA CASA
// Se a sua casa usa outros nomes, é só editar aqui embaixo.
// ===============================================
const LINHAS = [
  { nome:"Oxalá",     sub:"Linha da Fé" },
  { nome:"Yemanjá",   sub:"Linha da Geração" },
  { nome:"Oxum",      sub:"Linha do Amor" },
  { nome:"Oxóssi",    sub:"Linha do Conhecimento" },
  { nome:"Xangô",     sub:"Linha da Justiça" },
  { nome:"Ogum",      sub:"Linha da Lei" },
  { nome:"Obaluaiê",  sub:"Linha da Evolução" },
  { nome:"Esquerda",  sub:"Exus e Pombagiras", esquerda:true }
];

let perfil = null, usuarioAlvo = null, souAdmin = false, dados = [];

// ===============================================
// TEMA
// ===============================================
function aplicarTema(){
  const t = localStorage.getItem("tema");
  document.body.classList.toggle("pergaminho", t === "claro" || t === "pergaminho");
  document.getElementById("btnTema").textContent = document.body.classList.contains("pergaminho") ? "☀" : "☾";
}
function trocarTema(){
  const claro = !document.body.classList.contains("pergaminho");
  localStorage.setItem("tema", claro ? "claro" : "escuro");
  aplicarTema();
}
aplicarTema();

function aviso(txt){
  const a = document.getElementById("aviso");
  a.textContent = txt; a.style.display = "block";
  clearTimeout(a._t); a._t = setTimeout(()=>a.style.display="none", 2600);
}
function esc(t){ return (t||"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

// ===============================================
// INÍCIO
// ===============================================
(async function iniciar(){
  const { data:{ session } } = await db.auth.getSession();
  if(!session){ window.location.href = "index.html"; return; }

  const { data:p } = await db.from("profiles").select("*").eq("id", session.user.id).single();
  if(!p){ window.location.href = "index.html"; return; }

  perfil = p;
  souAdmin = (p.role === "admin");
  usuarioAlvo = p.id;
  document.getElementById("subtitulo").textContent = p.nome || p.email;

  if(souAdmin){
    const painel = document.getElementById("painelAdmin");
    painel.style.display = "block";
    const { data:lista } = await db.from("profiles").select("id,nome,email").order("nome");
    const sel = document.getElementById("seletorMedium");
    sel.innerHTML = (lista||[]).map(m =>
      `<option value="${m.id}" ${m.id===p.id?"selected":""}>${esc(m.nome||m.email)}</option>`
    ).join("");
  }

  await carregar();
})();

async function trocarMedium(){
  usuarioAlvo = document.getElementById("seletorMedium").value;
  const sel = document.getElementById("seletorMedium");
  document.getElementById("subtitulo").textContent = sel.options[sel.selectedIndex].text;
  await carregar();
}

async function carregar(){
  const { data, error } = await db.from("entidades")
    .select("*").eq("user_id", usuarioAlvo)
    .order("linha").order("created_at");
  if(error){ aviso("Não deu pra carregar. Tente de novo."); return; }
  dados = data || [];
  desenhar();
}

// ===============================================
// TELA
// ===============================================
function desenhar(){
  const abertas = [...document.querySelectorAll(".linha.aberta")].map(e=>e.dataset.linha);
  const podeEditar = (usuarioAlvo === perfil.id) || souAdmin;

  document.getElementById("conteudo").innerHTML = LINHAS.map(L => {
    const lista = dados.filter(e => e.linha === L.nome);
    const cards = lista.length
      ? lista.map(e => `
        <div class="entidade">
          <h4>${esc(e.nome)}</h4>
          ${(e.tipo||e.dia) ? `<div class="meta">${esc(e.tipo||"")}${e.tipo&&e.dia?" · ":""}${esc(e.dia||"")}</div>`:""}
          ${e.observacao ? `<div class="obs">${esc(e.observacao)}</div>`:""}
          ${podeEditar ? `<div class="acoes">
            <button onclick="editar('${e.id}')">editar</button>
            <button onclick="apagar('${e.id}')">apagar</button>
          </div>`:""}
        </div>`).join("")
      : `<div class="vazio">Nenhuma entidade registrada nesta linha.</div>`;

    const form = podeEditar ? `
      <button class="btn-add" onclick="abrirForm('${L.nome}')">+ Adicionar entidade</button>
      <div class="form-ent" id="form-${L.nome}">
        <input type="hidden" id="id-${L.nome}">
        <div class="campo">
          <label>Nome da entidade</label>
          <input id="nome-${L.nome}" placeholder="${L.esquerda ? "Ex: Exu Tranca Ruas" : "Ex: Caboclo Sete Flechas"}">
        </div>
        <div class="linha2">
          <div class="campo">
            <label>Falange / povo</label>
            <input id="tipo-${L.nome}" placeholder="${L.esquerda ? "Exu, Pombagira, Exu Mirim" : "Caboclo, Preto Velho, Criança…"}">
          </div>
          <div class="campo">
            <label>Dia / gira</label>
            <input id="dia-${L.nome}" placeholder="Ex: gira de caboclos">
          </div>
        </div>
        <div class="campo">
          <label>Observações</label>
          <textarea id="obs-${L.nome}" placeholder="Ponto cantado, ervas, guias, firmeza, o que quiser guardar."></textarea>
        </div>
        <div class="btns">
          <button class="btn-ouro" onclick="salvar('${L.nome}')">Salvar</button>
          <button class="btn-vazio" onclick="fecharForm('${L.nome}')">Cancelar</button>
        </div>
      </div>` : "";

    return `
    <div class="linha ${L.esquerda?"esquerda":""} ${abertas.includes(L.nome)?"aberta":""}" data-linha="${L.nome}">
      <div class="linha-topo" onclick="alternar(this)">
        <div>
          <div class="linha-nome">${L.nome}</div>
          <div class="linha-sub">${L.sub}</div>
        </div>
        <div class="contador">${lista.length}</div>
      </div>
      <div class="linha-corpo">${cards}${form}</div>
    </div>`;
  }).join("");
}

function alternar(el){ el.parentElement.classList.toggle("aberta"); }

function abrirForm(linha){
  document.getElementById("id-"+linha).value = "";
  ["nome","tipo","dia","obs"].forEach(c => document.getElementById(c+"-"+linha).value = "");
  document.getElementById("form-"+linha).classList.add("ativo");
  document.getElementById("nome-"+linha).focus();
}
function fecharForm(linha){ document.getElementById("form-"+linha).classList.remove("ativo"); }

function editar(id){
  const e = dados.find(x => x.id === id);
  if(!e) return;
  const L = e.linha;
  document.querySelector(`.linha[data-linha="${L}"]`).classList.add("aberta");
  document.getElementById("form-"+L).classList.add("ativo");
  document.getElementById("id-"+L).value = e.id;
  document.getElementById("nome-"+L).value = e.nome || "";
  document.getElementById("tipo-"+L).value = e.tipo || "";
  document.getElementById("dia-"+L).value = e.dia || "";
  document.getElementById("obs-"+L).value = e.observacao || "";
  document.getElementById("nome-"+L).focus();
}

async function salvar(linha){
  const nome = document.getElementById("nome-"+linha).value.trim();
  if(!nome){ aviso("Escreva o nome da entidade."); return; }
  const id = document.getElementById("id-"+linha).value;
  const reg = {
    user_id: usuarioAlvo,
    linha: linha,
    nome: nome,
    tipo: document.getElementById("tipo-"+linha).value.trim() || null,
    dia: document.getElementById("dia-"+linha).value.trim() || null,
    observacao: document.getElementById("obs-"+linha).value.trim() || null
  };
  let erro;
  if(id){ ({ error:erro } = await db.from("entidades").update(reg).eq("id", id)); }
  else  { ({ error:erro } = await db.from("entidades").insert(reg)); }
  if(erro){ aviso("Não salvou: " + erro.message); return; }
  fecharForm(linha);
  aviso("Guardado.");
  await carregar();
  document.querySelector(`.linha[data-linha="${linha}"]`).classList.add("aberta");
}

async function apagar(id){
  const e = dados.find(x => x.id === id);
  if(!confirm("Apagar " + (e ? e.nome : "esta entidade") + "?")) return;
  const { error } = await db.from("entidades").delete().eq("id", id);
  if(error){ aviso("Não deu pra apagar."); return; }
  aviso("Apagado.");
  await carregar();
}
</script>
</body>
</html>
