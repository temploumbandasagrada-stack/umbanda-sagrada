<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Filmes e Documentários — Casa de Estudo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --noite:#0D1321; --noite2:#111A2E; --card:#16203A; --borda:#243350;
  --ouro:#C9A227; --ouro-claro:#E8CE7A; --branco:#F5F2EA; --suave:#9FB0CC;
  --perigo:#C46A6A;
}
body.claro{
  --noite:#EFE6D2; --noite2:#E6DBC2; --card:#F7F1E2; --borda:#D4C5A1;
  --ouro:#8A6A17; --ouro-claro:#6B520F; --branco:#2B2416; --suave:#6D6045;
  --perigo:#9E3B3B;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--noite);color:var(--branco);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;padding-bottom:70px}
header{background:linear-gradient(180deg,var(--noite2),var(--noite));border-bottom:1px solid var(--borda);padding:22px 18px 18px;text-align:center;position:relative}
header h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;color:var(--ouro-claro)}
header p{font-size:13px;color:var(--suave);margin-top:4px}
.canto{position:absolute;top:14px;display:flex;gap:8px}
.canto.esq{left:14px} .canto.dir{right:14px}
.canto a,.canto button{color:var(--suave);text-decoration:none;font-size:12px;border:1px solid var(--borda);border-radius:8px;padding:6px 10px;background:transparent;cursor:pointer;font-family:'Jost',sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:18px 14px}
input,textarea{width:100%;background:var(--noite2);border:1px solid var(--borda);color:var(--branco);border-radius:8px;padding:10px 12px;font-family:'Jost',sans-serif;font-size:15px}
textarea{resize:vertical;min-height:60px}
label{font-size:11px;color:var(--suave);display:block;margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase}
.campo{margin-bottom:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn-ouro{background:var(--ouro);color:#1a1206;border:none;border-radius:8px;padding:11px 18px;font-family:'Jost',sans-serif;font-weight:500;font-size:14px;cursor:pointer}
.btn-vazio{background:transparent;color:var(--suave);border:1px solid var(--borda);border-radius:8px;padding:11px 18px;font-family:'Jost',sans-serif;font-size:14px;cursor:pointer}
.bloco{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:14px;margin-bottom:18px;display:none}
.bloco.on{display:block}
.bloco h3{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--ouro-claro);margin-bottom:10px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.filme{background:var(--card);border:1px solid var(--borda);border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .15s}
.filme:hover{transform:translateY(-3px)}
.capa{width:100%;aspect-ratio:2/3;background:var(--noite2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.capa img{width:100%;height:100%;object-fit:cover}
.capa .semcapa{font-family:'Cormorant Garamond',serif;font-size:38px;color:var(--ouro);opacity:.5}
.filme .info{padding:10px 11px 12px}
.filme h4{font-family:'Cormorant Garamond',serif;font-size:17px;font-weight:600;line-height:1.25}
.filme p{font-size:12px;color:var(--suave);margin-top:4px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.filme .acoes{display:flex;gap:10px;padding:0 11px 11px}
.filme .acoes button{background:none;border:none;color:var(--suave);font-size:12px;cursor:pointer;font-family:'Jost',sans-serif;text-decoration:underline;padding:0}
.filme .acoes button.perigo{color:var(--perigo)}
.secao-titulo{display:flex;align-items:center;gap:12px;margin:26px 0 14px}
.secao-titulo:first-child{margin-top:4px}
.secao-titulo h2{font-family:'Cormorant Garamond',serif;font-size:24px;font-weight:600;color:var(--ouro-claro);white-space:nowrap}
.secao-titulo .conta{font-size:11px;color:var(--suave);border:1px solid var(--borda);border-radius:20px;padding:3px 10px}
.secao-titulo .risco{flex:1;height:1px;background:var(--borda)}
.vazio{font-size:14px;color:var(--suave);font-style:italic;padding:20px 4px;text-align:center}
.carregando{text-align:center;color:var(--suave);padding:40px 0;font-style:italic}
#aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--card);border:1px solid var(--ouro);padding:12px 20px;border-radius:10px;font-size:14px;display:none;z-index:60}
@media(max-width:480px){.grade{grid-template-columns:repeat(2,1fr)}header h1{font-size:25px}}
</style>
</head>
<body>

<header>
  <div class="canto esq"><a href="#" id="linkVoltar">← Voltar</a></div>
  <div class="canto dir">
    <button onclick="atualizarApp()">Atualizar</button>
    <button onclick="trocarTema()" id="btnTema">☾</button>
  </div>
  <h1>Cinema da Casa</h1>
  <p>Filmes e documentários indicados pela casa</p>
</header>

<div class="wrap">
  <div style="margin-bottom:14px;display:none" id="btnNovoBox">
    <button class="btn-ouro" onclick="abrirForm()">+ Indicar filme ou documentário</button>
  </div>

  <div class="bloco" id="blocoForm">
    <h3 id="formTitulo">Indicar novo filme</h3>
    <input type="hidden" id="fId">
    <div class="campo">
      <label>O que é</label>
      <select id="fTipo" style="width:100%;background:var(--noite2);border:1px solid var(--borda);color:var(--branco);border-radius:8px;padding:10px 12px;font-family:'Jost',sans-serif;font-size:15px">
        <option value="filme">Filme</option>
        <option value="documentario">Documentário</option>
      </select>
    </div>
    <div class="campo"><label>Título</label><input id="fTitulo" placeholder="Ex: Nosso Lar"></div>
    <div class="campo"><label>Link do filme (YouTube, Drive…)</label><input id="fLink" placeholder="https://..."></div>
    <div class="campo">
      <label>Capa do filme (opcional)</label>
      <input type="file" id="fArquivo" accept="image/*" onchange="preverCapa()">
      <div id="previaBox" style="display:none;margin-top:10px;align-items:center;gap:12px">
        <img id="previa" style="width:70px;height:105px;object-fit:cover;border-radius:8px;border:1px solid var(--borda)">
        <button type="button" class="btn-vazio" style="padding:7px 12px;font-size:13px" onclick="tirarCapa()">Tirar capa</button>
      </div>
      <input type="hidden" id="fCapa">
      <div style="font-size:12px;color:var(--suave);margin-top:6px">Escolha uma imagem do celular ou do computador. Fica melhor em pé, tipo cartaz.</div>
    </div>
    <div class="campo"><label>Descrição (opcional)</label><textarea id="fDesc" placeholder="Por que a casa indica este filme."></textarea></div>
    <div class="btns">
      <button class="btn-ouro" onclick="salvarFilme()" id="btnSalvar">Salvar</button>
      <button class="btn-vazio" onclick="fecharForm()">Cancelar</button>
    </div>
  </div>

  <div id="conteudo"><div class="carregando">Abrindo a sala de cinema…</div></div>
</div>

<div id="aviso"></div>

<script>
// ================= CONFIGURAÇÃO =================
const SUPABASE_URL = "https://jqepdfxtqdjtozbrlkrm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxZXBkZnh0cWRqdG96YnJsa3JtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MTM4NjUsImV4cCI6MjEwMTE4OTg2NX0.9B_GAcACUsRBAe1GY7MUzmk1prquDsA6YsKp3f3v4Z0";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let perfil=null, podeEditar=false, filmes=[];

function aplicarTema(){
  const t = localStorage.getItem('tema');
  document.body.classList.toggle('claro', t==='claro'||t==='pergaminho');
  document.getElementById('btnTema').textContent = document.body.classList.contains('claro') ? '☀' : '☾';
}
function trocarTema(){
  const claro = !document.body.classList.contains('claro');
  localStorage.setItem('tema', claro?'claro':'escuro');
  aplicarTema();
}
aplicarTema();

async function atualizarApp(){
  try{ const n = await caches.keys(); await Promise.all(n.map(x=>caches.delete(x))); }catch(e){}
  try{ const r = await navigator.serviceWorker.getRegistration(); if(r){ await r.update(); if(r.waiting) r.waiting.postMessage('skip'); } }catch(e){}
  location.href = location.pathname + '?v=' + Date.now();
}
function aviso(t){
  const a=document.getElementById('aviso');
  a.textContent=t; a.style.display='block';
  clearTimeout(a._t); a._t=setTimeout(()=>a.style.display='none',2800);
}
function esc(t){ return (t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

(async function(){
  const { data:{ session } } = await db.auth.getSession();
  if(!session){ location.href='index.html'; return; }
  const { data:p } = await db.from('profiles').select('*').eq('id', session.user.id).single();
  if(!p){ location.href='index.html'; return; }
  perfil = p;
  podeEditar = (p.role==='admin' || p.role==='editor');
  document.getElementById('linkVoltar').href = (p.role==='admin') ? 'admin.html' : 'aluno.html';
  if(podeEditar) document.getElementById('btnNovoBox').style.display='block';
  await carregar();
})();

async function carregar(){
  const { data, error } = await db.from('filmes').select('*').order('created_at',{ascending:false});
  if(error){
    document.getElementById('conteudo').innerHTML='<div class="vazio">Rode o arquivo adicionar-filmes-e-niveis.sql no Supabase.</div>';
    return;
  }
  filmes = data || [];
  desenhar();
}

function desenhar(){
  if(!filmes.length){
    document.getElementById('conteudo').innerHTML='<div class="vazio">Nada indicado ainda.</div>';
    return;
  }
  const doces = filmes.filter(f => (f.tipo||'filme') !== 'documentario');
  const docs  = filmes.filter(f => (f.tipo||'filme') === 'documentario');

  document.getElementById('conteudo').innerHTML =
      bloco('Filmes', doces, 'Nenhum filme indicado ainda.')
    + bloco('Documentários', docs, 'Nenhum documentário indicado ainda.');
}

function bloco(nome, lista, vazio){
  return '<div class="secao-titulo"><h2>' + nome + '</h2>'
    + '<span class="conta">' + lista.length + '</span><div class="risco"></div></div>'
    + (lista.length ? '<div class="grade">' + lista.map(cartao).join('') + '</div>'
                    : '<div class="vazio">' + vazio + '</div>');
}

function cartao(f){
  return `
    <div class="filme">
      <div onclick="assistir('${f.id}')">
        <div class="capa">${f.capa_url
          ? '<img src="'+esc(f.capa_url)+'" alt="" onerror="this.parentElement.innerHTML=\'<span class=semcapa>✦</span>\'">'
          : '<span class="semcapa">✦</span>'}</div>
        <div class="info">
          <h4>${esc(f.titulo)}</h4>
          ${f.descricao?'<p>'+esc(f.descricao)+'</p>':''}
        </div>
      </div>
      ${podeEditar?`<div class="acoes">
        <button onclick="editarFilme('${f.id}')">editar</button>
        <button class="perigo" onclick="apagarFilme('${f.id}')">apagar</button>
      </div>`:''}
    </div>`;
}

function assistir(id){
  const f = filmes.find(x=>x.id===id);
  if(f && f.link) window.open(f.link, '_blank');
}

let capaNova = null;   // arquivo escolhido, ainda não enviado

function preverCapa(){
  const f = document.getElementById('fArquivo').files[0];
  if(!f) return;
  if(!f.type.startsWith('image/')){ aviso('Escolha uma imagem.'); document.getElementById('fArquivo').value=''; return; }
  if(f.size > 5*1024*1024){ aviso('Imagem muito pesada. Use uma até 5 MB.'); document.getElementById('fArquivo').value=''; return; }
  capaNova = f;
  const leitor = new FileReader();
  leitor.onload = e => {
    document.getElementById('previa').src = e.target.result;
    document.getElementById('previaBox').style.display = 'flex';
  };
  leitor.readAsDataURL(f);
}
function tirarCapa(){
  capaNova = null;
  document.getElementById('fArquivo').value = '';
  document.getElementById('fCapa').value = '';
  document.getElementById('previaBox').style.display = 'none';
}
function mostrarCapaAtual(url){
  if(url){
    document.getElementById('previa').src = url;
    document.getElementById('previaBox').style.display = 'flex';
  } else {
    document.getElementById('previaBox').style.display = 'none';
  }
}
async function enviarCapa(file){
  const nome = 'capas-filme/' + Date.now() + '_' + file.name.replace(/[^\w.\-]/g,'_');
  const { error } = await db.storage.from('materiais').upload(nome, file);
  if(error) throw error;
  return db.storage.from('materiais').getPublicUrl(nome).data.publicUrl;
}

function abrirForm(){
  document.getElementById('fId').value='';
  ['fTitulo','fLink','fCapa','fDesc'].forEach(i=>document.getElementById(i).value='');
  tirarCapa();
  document.getElementById('fTipo').value='filme';
  document.getElementById('formTitulo').textContent='Indicar novo filme ou documentário';
  document.getElementById('btnSalvar').textContent='Salvar filme';
  document.getElementById('blocoForm').classList.add('on');
  document.getElementById('fTitulo').focus();
}
function fecharForm(){ document.getElementById('blocoForm').classList.remove('on'); }

function editarFilme(id){
  const f = filmes.find(x=>x.id===id); if(!f) return;
  document.getElementById('fId').value=f.id;
  document.getElementById('fTipo').value=f.tipo||'filme';
  document.getElementById('fTitulo').value=f.titulo||'';
  document.getElementById('fLink').value=f.link||'';
  document.getElementById('fCapa').value=f.capa_url||'';
  document.getElementById('fDesc').value=f.descricao||'';
  capaNova = null;
  document.getElementById('fArquivo').value = '';
  mostrarCapaAtual(f.capa_url);
  document.getElementById('formTitulo').textContent='Editar';
  document.getElementById('btnSalvar').textContent='Salvar alteração';
  document.getElementById('blocoForm').classList.add('on');
  window.scrollTo({top:0,behavior:'smooth'});
}

async function salvarFilme(){
  const titulo = document.getElementById('fTitulo').value.trim();
  const link = document.getElementById('fLink').value.trim();
  if(!titulo){ aviso('Escreva o título.'); return; }
  if(!link){ aviso('Cole o link do filme.'); return; }
  const id = document.getElementById('fId').value;
  const btn = document.getElementById('btnSalvar');
  const textoBtn = btn.textContent;

  let capa = document.getElementById('fCapa').value.trim() || null;
  if(capaNova){
    btn.disabled = true; btn.textContent = 'Enviando capa…';
    try{ capa = await enviarCapa(capaNova); }
    catch(e){
      btn.disabled = false; btn.textContent = textoBtn;
      aviso('Não deu pra enviar a capa: ' + e.message);
      return;
    }
  }

  const reg = {
    tipo: document.getElementById('fTipo').value,
    titulo: titulo, link: link,
    capa_url: capa,
    descricao: document.getElementById('fDesc').value.trim() || null
  };
  btn.textContent = 'Salvando…';
  let erro;
  if(id){ ({error:erro} = await db.from('filmes').update(reg).eq('id',id)); }
  else  { ({error:erro} = await db.from('filmes').insert(reg)); }
  btn.disabled = false; btn.textContent = textoBtn;
  if(erro){ aviso('Não salvou: '+erro.message); return; }
  capaNova = null;
  fecharForm(); aviso('Filme guardado.'); await carregar();
}

async function apagarFilme(id){
  const f = filmes.find(x=>x.id===id);
  if(!confirm('Apagar "'+(f?f.titulo:'este filme')+'"?')) return;
  const { error } = await db.from('filmes').delete().eq('id',id);
  if(error){ aviso('Não deu pra apagar.'); return; }
  aviso('Apagado.'); await carregar();
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
