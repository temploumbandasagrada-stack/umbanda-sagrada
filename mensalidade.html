<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mensalidade — Casa de Estudo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --noite:#0D1321; --noite2:#111A2E; --card:#16203A; --borda:#243350;
  --ouro:#C9A227; --ouro-claro:#E8CE7A; --branco:#F5F2EA; --suave:#9FB0CC;
  --perigo:#C46A6A; --verde:#6FA87C;
}
body.claro{
  --noite:#EFE6D2; --noite2:#E6DBC2; --card:#F7F1E2; --borda:#D4C5A1;
  --ouro:#8A6A17; --ouro-claro:#6B520F; --branco:#2B2416; --suave:#6D6045;
  --perigo:#9E3B3B; --verde:#3E6B4A;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--noite);color:var(--branco);font-family:'Jost',sans-serif;font-weight:300;min-height:100vh;padding-bottom:70px}
header{background:linear-gradient(180deg,var(--noite2),var(--noite));border-bottom:1px solid var(--borda);padding:22px 18px 18px;text-align:center;position:relative}
header h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:30px;color:var(--ouro-claro)}
header p{font-size:13px;color:var(--suave);margin-top:4px}
.canto{position:absolute;top:14px;display:flex;gap:8px}
.canto.esq{left:14px} .canto.dir{right:14px}
.canto a,.canto button{color:var(--suave);text-decoration:none;font-size:12px;border:1px solid var(--borda);border-radius:8px;padding:6px 10px;background:transparent;cursor:pointer;font-family:'Jost',sans-serif}
.wrap{max-width:940px;margin:0 auto;padding:16px 14px}
select,input{width:100%;background:var(--noite2);border:1px solid var(--borda);color:var(--branco);border-radius:8px;padding:9px 11px;font-family:'Jost',sans-serif;font-size:14px}
label{font-size:11px;color:var(--suave);display:block;margin-bottom:4px;letter-spacing:.5px;text-transform:uppercase}
.campo{margin-bottom:9px}
.grade{display:flex;gap:9px;flex-wrap:wrap}
.grade>div{flex:1;min-width:120px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.btn-ouro{background:var(--ouro);color:#1a1206;border:none;border-radius:8px;padding:10px 16px;font-family:'Jost',sans-serif;font-weight:500;font-size:14px;cursor:pointer}
.btn-vazio{background:transparent;color:var(--suave);border:1px solid var(--borda);border-radius:8px;padding:10px 16px;font-family:'Jost',sans-serif;font-size:14px;cursor:pointer}
.mini{background:transparent;border:1px solid var(--borda);color:var(--suave);border-radius:6px;padding:5px 9px;font-size:12px;cursor:pointer;font-family:'Jost',sans-serif;white-space:nowrap}
.mini.ok{color:var(--verde);border-color:rgba(111,168,124,.45)}
.mini.perigo{color:var(--perigo);border-color:rgba(196,106,106,.4)}

.bloco{background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:13px;margin-bottom:14px}
.bloco h3{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--ouro-claro);margin-bottom:9px}

.resumo{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.resumo div{flex:1;min-width:110px;background:var(--card);border:1px solid var(--borda);border-radius:12px;padding:11px 13px}
.resumo b{display:block;font-family:'Cormorant Garamond',serif;font-size:23px;color:var(--ouro-claro)}
.resumo small{color:var(--suave);font-size:10.5px;letter-spacing:.8px;text-transform:uppercase}

.linha-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--borda);border-radius:10px;padding:10px 13px;margin-bottom:7px;flex-wrap:wrap}
.linha-item .quem{flex:1;min-width:150px}
.linha-item .quem b{font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;display:block;line-height:1.2}
.linha-item .quem small{color:var(--suave);font-size:11.5px;text-transform:capitalize}
.linha-item .lado{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.linha-item.destaque{border-color:rgba(196,106,106,.4)}

.tag{font-size:11px;border-radius:20px;padding:4px 10px;white-space:nowrap;border:1px solid var(--borda);color:var(--suave)}
.tag.pago{color:var(--verde);border-color:rgba(111,168,124,.45)}
.tag.atrasado{color:var(--perigo);border-color:rgba(196,106,106,.45)}
.tag.aberto{color:var(--ouro-claro);border-color:rgba(201,162,39,.45)}
.tag.nao_pago{color:var(--perigo);border-color:rgba(196,106,106,.45)}
.tag.isento{color:var(--suave)}
.tag.sino{color:var(--ouro-claro);border-color:rgba(201,162,39,.45)}

.lembrete{background:rgba(201,162,39,.09);border:1px solid rgba(201,162,39,.4);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.lembrete b{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--ouro-claro);display:block;margin-bottom:3px}
.lembrete p{font-size:14px;line-height:1.5}
.lembrete small{color:var(--suave);font-size:11.5px;display:block;margin-top:5px}

.vazio{font-size:14px;color:var(--suave);font-style:italic;padding:14px 2px}
.carregando{text-align:center;color:var(--suave);padding:40px 0;font-style:italic}
#aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;background:var(--card);border:1px solid var(--ouro);padding:12px 20px;border-radius:10px;font-size:14px;display:none;z-index:60}
@media(max-width:520px){header h1{font-size:25px}.grade>div{min-width:100%}}
</style>
</head>
<body>

<header>
  <div class="canto esq"><a href="#" id="linkVoltar">← Voltar</a></div>
  <div class="canto dir">
    <button onclick="atualizarApp()">Atualizar</button>
    <button onclick="trocarTema()" id="btnTema">☾</button>
  </div>
  <h1>Mensalidade</h1>
  <p id="subtitulo">Carregando…</p>
</header>

<div class="wrap" id="wrap">
  <div class="carregando">Abrindo o livro caixa…</div>
</div>

<div id="aviso"></div>

<script>
// ================= CONFIGURAÇÃO =================
const SUPABASE_URL = "https://jqepdfxtqdjtozbrlkrm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpxZXBkZnh0cWRqdG96YnJsa3JtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2MTM4NjUsImV4cCI6MjEwMTE4OTg2NX0.9B_GAcACUsRBAe1GY7MUzmk1prquDsA6YsKp3f3v4Z0";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let perfil=null, souAdmin=false, pessoas=[], nomes={}, configs={}, cobrancas=[], lembretes=[];
let fPessoa='todos', fStatus='todos', fAno=String(new Date().getFullYear());

const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

// ================= UTIL =================
function aplicarTema(){
  const t = localStorage.getItem('tema');
  document.body.classList.toggle('claro', t==='claro'||t==='pergaminho');
  document.getElementById('btnTema').textContent = document.body.classList.contains('claro') ? '☀' : '☾';
}
function trocarTema(){
  const claro = !document.body.classList.contains('claro');
  localStorage.setItem('tema', claro?'claro':'escuro');
  aplicarTema();
}
aplicarTema();

async function atualizarApp(){
  try{ const n = await caches.keys(); await Promise.all(n.map(x=>caches.delete(x))); }catch(e){}
  try{ const r = await navigator.serviceWorker.getRegistration(); if(r){ await r.update(); if(r.waiting) r.waiting.postMessage('skip'); } }catch(e){}
  location.href = location.pathname + '?v=' + Date.now();
}
function aviso(t){
  const a=document.getElementById('aviso');
  a.textContent=t; a.style.display='block';
  clearTimeout(a._t); a._t=setTimeout(()=>a.style.display='none',3000);
}
function esc(t){ return (t||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function hoje(){ const d=new Date(); return new Date(d.getFullYear(),d.getMonth(),d.getDate()); }
function dataBR(iso){ if(!iso) return ''; const p=String(iso).slice(0,10).split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function nomeMes(iso){ const p=String(iso).slice(0,10).split('-'); return MESES[parseInt(p[1],10)-1]+'/'+p[0]; }
function dinheiro(v){ return 'R$ ' + Number(v||0).toFixed(2).replace('.',','); }
function dataISO(d){
  const m=String(d.getMonth()+1).padStart(2,'0'), dia=String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+dia;
}
function ultimoDiaMes(a,m){ return new Date(a,m+1,0).getDate(); }

function situacao(c){
  if(c.status==='pago') return {classe:'pago', texto:'Pago'};
  if(c.status==='nao_pago') return {classe:'nao_pago', texto:'Não pago'};
  if(c.status==='isento') return {classe:'isento', texto:'Isento'};
  const venc = new Date(String(c.vencimento).slice(0,10)+'T00:00:00');
  if(venc < hoje()){
    const dias = Math.round((hoje()-venc)/86400000);
    return {classe:'atrasado', texto:'Atrasado '+dias+'d'};
  }
  return {classe:'aberto', texto:'Em aberto'};
}

// ================= INÍCIO =================
(async function(){
  const { data:{ session } } = await db.auth.getSession();
  if(!session){ location.href='index.html'; return; }
  const { data:p } = await db.from('profiles').select('*').eq('id', session.user.id).single();
  if(!p){ location.href='index.html'; return; }

  perfil=p; souAdmin=(p.role==='admin');
  document.getElementById('linkVoltar').href = souAdmin ? 'admin.html' : 'aluno.html';
  document.getElementById('subtitulo').textContent = souAdmin ? 'Direção da casa' : (p.nome || p.email);

  await recarregar();
})();

async function recarregar(){
  if(souAdmin){
    const { data:l } = await db.from('profiles').select('id,nome,email').order('nome');
    pessoas = l || [];
  } else pessoas = [perfil];
  nomes = {};
  pessoas.forEach(u => nomes[u.id] = u.nome || u.email);

  const { data:cfg, error:e1 } = await db.from('mensalidade_config').select('*');
  if(e1){ document.getElementById('wrap').innerHTML='<div class="vazio">Rode o arquivo adicionar-mensalidades.sql no Supabase.</div>'; return; }
  configs = {}; (cfg||[]).forEach(c => configs[c.user_id]=c);

  if(souAdmin) await lancarAteDezembro();

  const { data:m } = await db.from('mensalidades').select('*').order('competencia',{ascending:true});
  cobrancas = m || [];
  const { data:lb } = await db.from('lembretes_mensalidade').select('*');
  lembretes = lb || [];

  souAdmin ? telaAdmin() : telaMedium();
}

// ===== lança tudo do início até dezembro do ano corrente
async function lancarAteDezembro(){
  const { data:existentes } = await db.from('mensalidades').select('user_id,competencia');
  const jaTem = {};
  (existentes||[]).forEach(m => jaTem[m.user_id+'|'+String(m.competencia).slice(0,10)] = true);

  const novos = [];
  const anoAtual = hoje().getFullYear();
  const limite = new Date(anoAtual, 11, 1); // dezembro deste ano

  Object.keys(configs).forEach(uid=>{
    const c = configs[uid];
    if(!c.ativo) return;
    const ini = new Date(String(c.inicio).slice(0,10)+'T00:00:00');
    let cur = new Date(ini.getFullYear(), ini.getMonth(), 1);
    let guarda = 0;
    while(cur <= limite && guarda < 300){
      guarda++;
      const comp = dataISO(cur);
      if(!jaTem[uid+'|'+comp]){
        const dia = Math.min(c.dia_vencimento||10, ultimoDiaMes(cur.getFullYear(), cur.getMonth()));
        novos.push({
          user_id: uid, competencia: comp,
          vencimento: dataISO(new Date(cur.getFullYear(), cur.getMonth(), dia)),
          valor: c.valor||0, status:'aberto'
        });
      }
      cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
    }
  });

  if(novos.length){
    const { error } = await db.from('mensalidades').insert(novos);
    if(!error) aviso(novos.length+' mensalidade(s) lançada(s) até dezembro.');
  }
}

// ================= FILTROS =================
function mudarFiltro(qual, valor){
  if(qual==='pessoa') fPessoa=valor;
  if(qual==='status') fStatus=valor;
  if(qual==='ano') fAno=valor;
  telaAdmin();
}

function filtradas(){
  return cobrancas.filter(c=>{
    if(fPessoa!=='todos' && c.user_id!==fPessoa) return false;
    if(fAno!=='todos' && String(c.competencia).slice(0,4)!==fAno) return false;
    if(fStatus!=='todos'){
      const s = situacao(c).classe;
      if(fStatus==='atrasado' && s!=='atrasado') return false;
      if(fStatus==='aberto' && c.status!=='aberto') return false;
      if(fStatus==='pago' && c.status!=='pago') return false;
      if(fStatus==='nao_pago' && c.status!=='nao_pago') return false;
    }
    return true;
  });
}

// ================= TELA DA DIREÇÃO =================
function telaAdmin(){
  const anos = {};
  cobrancas.forEach(c => anos[String(c.competencia).slice(0,4)]=true);
  const listaAnos = Object.keys(anos).sort();
  if(listaAnos.indexOf(fAno)<0 && listaAnos.length) fAno = listaAnos[listaAnos.length-1];

  const filtro = '<div class="bloco"><div class="grade">'
    + '<div class="campo"><label>Médium</label><select onchange="mudarFiltro(\'pessoa\',this.value)">'
    + '<option value="todos">Todos os médiuns</option>'
    + pessoas.map(u=>'<option value="'+u.id+'" '+(fPessoa===u.id?'selected':'')+'>'+esc(nomes[u.id])+'</option>').join('')
    + '</select></div>'
    + '<div class="campo"><label>Situação</label><select onchange="mudarFiltro(\'status\',this.value)">'
    + '<option value="todos" '+(fStatus==='todos'?'selected':'')+'>Todas</option>'
    + '<option value="atrasado" '+(fStatus==='atrasado'?'selected':'')+'>Atrasadas</option>'
    + '<option value="aberto" '+(fStatus==='aberto'?'selected':'')+'>Em aberto</option>'
    + '<option value="pago" '+(fStatus==='pago'?'selected':'')+'>Pagas</option>'
    + '<option value="nao_pago" '+(fStatus==='nao_pago'?'selected':'')+'>Não pagas</option>'
    + '</select></div>'
    + '<div class="campo"><label>Ano</label><select onchange="mudarFiltro(\'ano\',this.value)">'
    + '<option value="todos" '+(fAno==='todos'?'selected':'')+'>Todos</option>'
    + listaAnos.map(a=>'<option value="'+a+'" '+(fAno===a?'selected':'')+'>'+a+'</option>').join('')
    + '</select></div>'
    + '</div></div>';

  // cadastro aparece só quando um médium está selecionado
  let cadastro = '';
  if(fPessoa!=='todos'){
    const c = configs[fPessoa];
    cadastro = '<div class="bloco"><h3>Cadastro de ' + esc(nomes[fPessoa]) + '</h3>'
      + '<div class="grade">'
      + '<div class="campo"><label>Valor (R$)</label><input type="number" step="0.01" id="cfgValor" value="'+(c?c.valor:'')+'" placeholder="0,00"></div>'
      + '<div class="campo"><label>Vence todo dia</label><input type="number" min="1" max="31" id="cfgDia" value="'+(c?c.dia_vencimento:10)+'"></div>'
      + '<div class="campo"><label>Começa em</label><input type="date" id="cfgIni" value="'+(c?String(c.inicio).slice(0,10):'')+'"></div>'
      + '</div>'
      + '<div class="campo"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;font-size:13px">'
      + '<input type="checkbox" id="cfgAtivo" style="width:auto" '+(!c||c.ativo?'checked':'')+'><span>Cobrar mensalidade deste médium</span></label></div>'
      + '<div class="btns"><button class="btn-ouro" onclick="salvarConfig()">Salvar e lançar até dezembro</button></div>'
      + (c ? '' : '<div class="vazio" style="padding-bottom:0">Ainda sem cadastro. Ao salvar, os meses são lançados de uma vez.</div>')
      + '</div>';
  }

  const lista = filtradas();
  let recebido=0, aberto=0, atrasadas=0;
  lista.forEach(c=>{
    if(c.status==='pago') recebido += Number(c.valor||0);
    else if(c.status==='aberto'){
      aberto += Number(c.valor||0);
      if(situacao(c).classe==='atrasado') atrasadas++;
    }
  });

  const temLembrete = {};
  lembretes.forEach(l => temLembrete[l.mensalidade_id]=true);

  const linhas = lista.length ? lista.slice().sort((a,b)=>{
    if(a.competencia===b.competencia) return (nomes[a.user_id]||'').localeCompare(nomes[b.user_id]||'');
    return a.competencia < b.competencia ? 1 : -1;
  }).map(m=>{
    const s = situacao(m);
    const acoes = m.status==='aberto'
      ? '<button class="mini ok" onclick="baixa(\''+m.id+'\',\'pago\')">Pagou</button>'
      + '<button class="mini perigo" onclick="baixa(\''+m.id+'\',\'nao_pago\')">Não pagou</button>'
      + '<button class="mini" onclick="pedirLembrete(\''+m.id+'\',\''+m.user_id+'\')">Lembrete</button>'
      : '<button class="mini" onclick="baixa(\''+m.id+'\',\'aberto\')">Reabrir</button>';
    return '<div class="linha-item '+(s.classe==='atrasado'?'destaque':'')+'">'
      + '<div class="quem"><b>'+esc(nomes[m.user_id]||'—')+'</b>'
      + '<small>'+nomeMes(m.competencia)+' · '+dinheiro(m.valor)+' · vence '+dataBR(m.vencimento)
      + (m.pago_em&&m.status==='pago'?' · pago '+dataBR(m.pago_em):'')+'</small></div>'
      + '<div class="lado">'
      + (temLembrete[m.id]?'<span class="tag sino">lembrete ativo</span>':'')
      + '<span class="tag '+s.classe+'">'+s.texto+'</span>'+acoes+'</div></div>';
  }).join('') : '<div class="vazio">Nada encontrado com esses filtros.</div>';

  document.getElementById('wrap').innerHTML = filtro + cadastro
    + '<div class="resumo">'
    + '<div><b>'+dinheiro(recebido)+'</b><small>Recebido</small></div>'
    + '<div><b>'+dinheiro(aberto)+'</b><small>Em aberto</small></div>'
    + '<div><b>'+atrasadas+'</b><small>Atrasadas</small></div>'
    + '</div>' + linhas;
}

async function salvarConfig(){
  const uid = fPessoa;
  const valor = parseFloat(document.getElementById('cfgValor').value || '0');
  const dia = parseInt(document.getElementById('cfgDia').value || '10', 10);
  const ini = document.getElementById('cfgIni').value;
  const ativo = document.getElementById('cfgAtivo').checked;
  if(!ini){ aviso('Escolha a data de início.'); return; }
  if(dia<1||dia>31){ aviso('Dia de vencimento inválido.'); return; }

  const { error } = await db.from('mensalidade_config').upsert({
    user_id: uid, valor: valor, dia_vencimento: dia, inicio: ini, ativo: ativo,
    atualizado_em: new Date().toISOString()
  }, { onConflict:'user_id' });
  if(error){ aviso('Não salvou: '+error.message); return; }
  aviso('Cadastro guardado.');
  await recarregar();
}

async function baixa(id, novo){
  const reg = { status: novo, atualizado_em: new Date().toISOString() };
  if(novo==='pago'){
    const d = prompt('Data do pagamento (dd/mm/aaaa):', dataBR(dataISO(hoje())));
    if(d===null) return;
    const p = d.split('/');
    reg.pago_em = (p.length===3) ? (p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0')) : dataISO(hoje());
  } else if(novo==='aberto'){ reg.pago_em = null; }
  else { reg.pago_em = dataISO(hoje()); }

  const { error } = await db.from('mensalidades').update(reg).eq('id', id);
  if(error){ aviso('Não deu: '+error.message); return; }
  if(novo!=='aberto') await db.from('lembretes_mensalidade').delete().eq('mensalidade_id', id);
  aviso('Baixa registrada.');
  await recarregar();
}

async function pedirLembrete(mensId, uid){
  const c = cobrancas.find(x=>x.id===mensId);
  const d = prompt('A partir de que dia o médium vê o lembrete? (dd/mm/aaaa)', dataBR(dataISO(hoje())));
  if(d===null) return;
  const p = d.split('/');
  if(p.length!==3){ aviso('Data inválida.'); return; }
  const iso = p[2]+'-'+p[1].padStart(2,'0')+'-'+p[0].padStart(2,'0');
  const msg = prompt('Mensagem do lembrete:', 'Sua mensalidade de '+nomeMes(c.competencia)+' está em aberto.');
  if(msg===null) return;
  const { error } = await db.from('lembretes_mensalidade').insert({
    user_id: uid, mensalidade_id: mensId, mensagem: msg, data_lembrete: iso
  });
  if(error){ aviso('Não deu: '+error.message); return; }
  aviso('Lembrete criado. Some quando você der baixa.');
  await recarregar();
}

// ================= TELA DO MÉDIUM =================
function telaMedium(){
  const c = configs[perfil.id];
  const minhas = cobrancas.filter(x=>x.user_id===perfil.id).slice().sort((a,b)=> a.competencia<b.competencia?1:-1);
  const emAberto = minhas.filter(x=>x.status==='aberto');
  const atras = emAberto.filter(x=>situacao(x).classe==='atrasado');
  const devendo = emAberto.reduce((s,x)=>s+Number(x.valor||0),0);

  const meus = lembretes.filter(l => l.user_id===perfil.id && new Date(l.data_lembrete+'T00:00:00') <= hoje());
  const avisos = meus.map(l=>
    '<div class="lembrete"><b>Lembrete da direção</b><p>'+esc(l.mensagem||'Mensalidade em aberto.')+'</p>'
    + '<small>Desde '+dataBR(l.data_lembrete)+'</small></div>').join('');

  if(!c || !c.ativo){
    document.getElementById('wrap').innerHTML = avisos +
      '<div class="bloco"><h3>Sem cobrança ativa</h3><div class="vazio">A direção ainda não cadastrou mensalidade para você. Se achar que é engano, fale com a casa.</div></div>';
    return;
  }

  const estado = atras.length
    ? '<span class="tag atrasado">'+atras.length+' em atraso</span>'
    : (emAberto.length ? '<span class="tag aberto">'+emAberto.length+' em aberto</span>'
                       : '<span class="tag pago">Tudo em dia</span>');

  const linhas = minhas.length ? minhas.map(m=>{
    const s = situacao(m);
    return '<div class="linha-item '+(s.classe==='atrasado'?'destaque':'')+'">'
      + '<div class="quem"><b style="text-transform:capitalize">'+nomeMes(m.competencia)+'</b>'
      + '<small>'+dinheiro(m.valor)+' · vence '+dataBR(m.vencimento)
      + (m.pago_em&&m.status==='pago'?' · pago em '+dataBR(m.pago_em):'')+'</small></div>'
      + '<div class="lado"><span class="tag '+s.classe+'">'+s.texto+'</span></div></div>';
  }).join('') : '<div class="vazio">Nenhum mês lançado ainda.</div>';

  document.getElementById('wrap').innerHTML = avisos
    + '<div class="resumo">'
    + '<div><b>'+dinheiro(c.valor)+'</b><small>Valor mensal</small></div>'
    + '<div><b>dia '+c.dia_vencimento+'</b><small>Vencimento</small></div>'
    + '<div><b>'+dinheiro(devendo)+'</b><small>Em aberto</small></div>'
    + '</div>'
    + '<div class="bloco"><h3>Situação <span style="float:right">'+estado+'</span></h3>'
    + '<div style="font-size:13px;color:var(--suave)">Só a direção da casa registra os pagamentos.</div></div>'
    + linhas;
}

if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
